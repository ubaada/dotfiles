
# enable mouse support
set -g mouse on

# copy to system clipboard via OSC 52 (portable: works in tmux and psmux)
set -g set-clipboard on


# tab/window status bar
# NOTE: separate style attrs with COMMAS, not spaces. tmux accepts either, but
# psmux (Windows) only splits on ',' and silently applies nothing otherwise.
set -g status-style 'bg=default,fg=white' # bg color of status bar set to bg of terminal

setw -g window-status-current-style 'fg=black,bg=colour245' # acitve tab/window
setw -g window-status-style 'fg=colour250,bg=default' # inactive tabs/windows
setw -g window-status-format ' #I #W #F ' # inactive window
setw -g window-status-current-format ' #I #W #F ' # active window, Format: index, name, flags
set -g status-left '    '                 # No left-side content

# lines dividing the panes
set -g pane-border-style 'fg=#2e2e2e'           # Color of inactive pane borders
set -g pane-active-border-style 'fg=yellow' # Color of active pane border


# enable normal copying text in tmux
setw -g mode-keys vi
bind -T root MouseDrag1Pane if -F "#{pane_in_mode}" "send -X begin-selection" "copy-mode -M"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# vim-style pane navigation with Ctrl-h/j/k/l
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R


# enable shift+enter for new line in opencode.
set-option -g extended-keys on
